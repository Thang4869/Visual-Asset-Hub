databases:
  # 1. PostgreSQL Database (Free Tier eligible)
  - name: vah-postgres
    plan: free # Note: Free databases are deleted after 90 days if inactive
    ipAllowList:
      - source: 0.0.0.0/0
        description: Allow everywhere (Fix for Singapore Web <-> Oregon DB)

services:
  # 2. .NET Backend API (Docker)
  - type: web
    name: vah-backend
    env: docker
    plan: free # Free tier may spin down after 15 mins of inactivity
    region: singapore # or ohio/frankfurt
    rootDir: ./VAH.Backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: vah-postgres
          property: connectionString
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DatabaseProvider
        value: PostgreSQL
      - key: Jwt__SecretKey
        value: VAH-SuperSecret-Key-For-Production-Random-String-!@#
      - key: ASPNETCORE_URLS
        value: http://+:10000
